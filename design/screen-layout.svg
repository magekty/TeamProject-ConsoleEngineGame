<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 515" width="980" height="515">
  <!-- 전체 창 외곽 테두리 -->
  <rect x="0.5" y="0.5" width="979" height="514" fill="#0C0C0C" stroke="#707070" stroke-width="1" />

  <!-- 상단 타이틀 바 -->
  <rect x="1" y="1" width="978" height="30" fill="#FFFFFF" />
  <line x1="1" y1="31" x2="979" y2="31" stroke="#E0E0E0" stroke-width="1" />

  <!-- 콘솔 아이콘 -->
  <g transform="translate(10, 9)">
    <rect width="16" height="13" fill="#46288C" rx="1" />
    <rect x="0" y="0" width="16" height="3" fill="#A0A0A0" />
    <text x="2" y="10" fill="#FFFFFF" font-family="monospace" font-size="7" font-weight="bold">C:\</text>
  </g>

  <!-- 창 제목 경로 텍스트 -->
  <text x="32" y="20" fill="#1A1A1A" font-family="'Malgun Gothic', 'Segoe UI', sans-serif" font-size="12">
    C:\GDV\TeamProject-ConsoleEngineGame\DodgeGame\bin\Debug\net9.0\DodgeGame.exe
  </text>

  <!-- 창 제어 버튼 (최소화, 최대화, 닫기) -->
  <g stroke="#1A1A1A" stroke-width="1" fill="none">
    <!-- 최소화 -->
    <line x1="860" y1="16" x2="870" y2="16" />
    <!-- 최대화 -->
    <rect x="905" y="11" width="9" height="9" />
    <!-- 닫기 -->
    <line x1="950" y1="11" x2="960" y2="21" />
    <line x1="960" y1="11" x2="950" y2="21" />
  </g>

  <!-- 우측 스크롤바 영역 -->
  <rect x="962" y="31" width="17" height="483" fill="#F0F0F0" />
  <!-- 위 화살표 -->
  <path d="M 967 42 L 970.5 38 L 974 42" stroke="#606060" stroke-width="1.2" fill="none" />
  <!-- 스크롤바 썸(Thumb) -->
  <rect x="964" y="50" width="13" height="445" fill="#CDCDCD" />
  <!-- 아래 화살표 -->
  <path d="M 967 503 L 970.5 507 L 974 503" stroke="#606060" stroke-width="1.2" fill="none" />

  <!-- 콘솔 내부 화면 텍스트 및 게임 요소 -->
  <g fill="#CCCCCC" font-family="'Consolas', 'Courier New', 'Malgun Gothic', monospace" font-size="16">
    <!-- 상단 시간 표시 -->
    <text x="4" y="45">시간 20 / 60초</text>

    <!-- 별(*) 장애물 배치 -->
    <text x="24" y="65">*</text>
    <text x="210" y="114">*</text>
    <text x="122" y="162">*</text>

    <!-- 게임 오버 안내 문구 -->
    <text x="40" y="190">게임 오버 - R: 다시</text>

    <!-- 하단 별(*) 및 플레이어(@) -->
    <text x="138" y="210">*</text>
    <text x="122" y="258">*</text>
    <text x="170" y="306">*</text>
    <text x="122" y="352">@</text>
  </g>
</svg>
